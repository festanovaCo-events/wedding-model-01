<section class="bg-sand pt-7.5 pb-2.5">
    <div>
        <div class="flex flex-col justify-center items-center">
            <h2 class="font-cookie text-heading text-center px-3.75 text-40 md:text-6xl leading-15">{{ pageCopy.portraits.title }}</h2>
            <p class="px-3.75 text-center text-base md:text-xl font-normal text-primary-soft">{{ pageCopy.portraits.description }}</p>

            <div #lottieContainer class="w-14 h-w-14 mx-auto mt-3.5">
                <ng-lottie *ngIf="shouldLoadAnimation" class="w-22.5 h-22.5 max-w-full max-h-full"
                    [options]="options" (animationCreated)="animationCreated($event)" />
            </div>
        </div>
    </div>

    <!-- Carrusel: se muestra cuando jQuery y Slick están cargados -->
    <ngx-slick-carousel *ngIf="carouselReady" style="margin-bottom: 30px;" class="carousel" [config]="slideConfig">
        <div ngxSlickItem *ngFor="let img of images; let i = index" class="slide">
            <div class="bg-white p-3.75 pb-25 shadow-rounded">
                <!-- Enlace con data-fancybox para abrir en modal -->
                <a href="{{ img.full }}" data-fancybox="gallery" [attr.data-caption]="pageCopy.portraits.caption">
                    <img ngSrc="{{ img.publicId }}" width="800" height="500"
                        sizes="(max-width: 480px) 100vw, (max-width: 1024px) 50vw, 33vw"
                        [alt]="portraitAlt(i)" [loaderParams]="{ transform: 'c_fill' }"
                        [priority]="i === 0" class="w-full h-125 object-cover" />
                </a>
            </div>
        </div>
    </ngx-slick-carousel>
</section>
