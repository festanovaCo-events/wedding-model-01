<section class="instructions">
    <div class="flex flex-col items-center justify-center relative z-999">
        <div class="flex flex-col justify-center items-center text-center">
            <h2 class="text-heading text-40 md:text-6xl leading-15 mb-0 font-cookie">{{ pageCopy.instructions.title }}</h2>
            <p class="text-theme-text text-base md:text-xl font-normal px-3.75">{{ pageCopy.instructions.description }}</p>
        </div>

        <div class="w-full flex flex-wrap justify-center gap-6 mt-20">
            <div class="grow basis-70 max-w-85 px-4" *ngFor="let card of cards">
                <div
                    class="w-full py-10 px-6.25 bg-linen rounded-20 min-h-100 flex flex-col justify-between items-center">
                    <h3 class="text-card-heading font-bold text-28">{{ card.title }}</h3>

                    <div class="flex justify-center items-center h-20 w-23.75">
                        <ng-lottie class="w-22.5 h-20 max-w-full max-h-full"
                            [options]="{ animationData: theme.animations[card.animationKey], loop: true, autoplay: true }"></ng-lottie>
                    </div>

                    <p class="text-theme-text mb-0 font-normal text-center" [innerHTML]="card.description"></p>

                    <button (click)="onCardClick(card)" class="w-85pct bg-white text-center hover:text-white hover:bg-primary
                         text-theme-text uppercase leading-3.75 text-15 rounded-50 px-7.5 py-3.25 
                         transition-all shadow-md font-bold cursor-pointer outline-none">
                        {{ card.label }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Vestuario -->
    <app-circular-modal [show]="showDressCodeModal" [title]="pageCopy.modals.dressCode.title"
        (close)="closeDressCodeModal()">
        <div icon class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">
            <img [src]="theme.assets.instructionIcons.dressCode" [alt]="pageCopy.modals.dressCode.iconAlt" class="w-full h-full object-contain" />
        </div>
        <app-content-dress-code-modal></app-content-dress-code-modal>
    </app-circular-modal>

    <!-- Modal de Tips y Notas -->
    <app-circular-modal [show]="showTipsModal" [title]="pageCopy.modals.tipsAndNotes.title"
        (close)="closeTipsModal()">
        <div icon class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">
            <img [src]="theme.assets.instructionIcons.tips" [alt]="pageCopy.modals.tipsAndNotes.iconAlt" class="w-full h-full object-contain" />
        </div>
        <app-content-tips-modal></app-content-tips-modal>
    </app-circular-modal>
</section>
