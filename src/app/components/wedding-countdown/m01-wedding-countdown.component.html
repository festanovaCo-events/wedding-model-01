<section class="bg-linen h-90 relative">
  <div class="justify-center items-center flex">
    <div
      class="box-aros absolute z-99 flex items-center justify-center h-90 w-90 md:h-117.5 md:w-117.5 -top-40pct md:-top-60pct xl:-top-90pct 2xl:-top-110pct">
      <div
        class="h-67.5 w-67.5 md:w-78.75 md:h-78.75 bg-white rounded-half shadow-rounded mx-auto text-center p-5">
        <div class="text-40 text-heading font-light md:mt-7.5">
          {{ pageCopy.countdown.title }}
        </div>

        <div class="flex mt-2.5 justify-center">
          <div class="w-25pct items-center border-r px-2 py-0 border-theme-border float-left">
            <div class="text-30 md:text-35 font-bold text-stone">{{ days }}</div>
            <div class="text-lg md:text-20 text-heading font-light">
              {{ pageCopy.countdown.days }}
            </div>
          </div>
          <div class="w-25pct items-center border-r px-2 py-0 border-theme-border float-left">
            <div class="text-30 md:text-35 font-bold text-stone">{{ hours }}</div>
            <div class="text-lg md:text-20 text-heading font-light">
              {{ pageCopy.countdown.hours }}
            </div>
          </div>
          <div class="w-25pct items-center border-r px-2 py-0 border-theme-border float-left">
            <div class="text-30 md:text-35 font-bold text-stone">
              {{ minutes }}
            </div>
            <div class="text-lg md:text-20 text-heading font-light">
              {{ pageCopy.countdown.minutes }}
            </div>
          </div>
          <div class="w-25pct items-center border-theme-border">
            <div class="text-30 md:text-35 font-bold text-stone">
              {{ seconds }}
            </div>
            <div class="text-lg md:text-20 text-heading font-light">
              {{ pageCopy.countdown.seconds }}
            </div>
          </div>
        </div>

        <div class="w-28 h-28 mx-auto">
          <ng-lottie [options]="options" (animationCreated)="animationCreated($event)" />
        </div>
      </div>
    </div>
  </div>
</section>
