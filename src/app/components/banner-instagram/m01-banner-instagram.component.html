<section class="instagram" [ngStyle]="{'background-image': 'url(' + weddingInfo.assets.instagramBackground + ')'}">
    <div class="flex flex-col text-center justify-center items-center z-999 relative">
        <h2
            class="font-cookie text-white text-40 md:text-6xl leading-10 md:leading-15 mb-0 px-10 drop-shadow-lg">
            {{ pageCopy.instagram.title }}
        </h2>
        <p class="text-white text-base md:text-xl font-normal px-3.75 mt-5 md:mt-0 drop-shadow-lg">
            {{ pageCopy.instagram.description }}
        </p>

        <div #lottieContainer class="flex justify-center items-center h-28 w-26.25 my-3">
            <ng-lottie *ngIf="shouldLoadAnimation" class="w-25 h-25 max-w-full max-h-full" [options]="options"
                (animationCreated)="animationCreated($event)"></ng-lottie>
        </div>

        <a [href]="pageCopy.instagram.url"
            target="_blank" rel="noopener noreferrer"
            class="text-white lowercase text-40 md:text-55 font-normal mb-10 drop-shadow-lg">{{
            pageCopy.instagram.hashtag }}</a>

        <a [href]="pageCopy.instagram.url" target="_blank" rel="noopener noreferrer" class="w-auto bg-white text-center hover:text-white hover:bg-primary
                     text-theme-text uppercase leading-3.75 text-15 rounded-50 px-7.5 py-3.25 
                     transition-all shadow-md font-bold cursor-pointer">{{ pageCopy.instagram.buttonText
            }}</a>
    </div>
</section>
