<section id="confirmations-section" class="confirmations w-full">
    <div [class]="isSingleOption 
        ? 'flex flex-col mx-auto gap-12 justify-center items-center' 
        : 'flex flex-col md:flex-row mx-auto gap-12 md:gap-18 lg:gap-44 justify-center items-center md:items-start'">
        <app-title-couple *ngIf="!isConfirmed" [name_wife]="weddingInfo.couple.wifeName"
            [name_husband]="weddingInfo.couple.husbandName"
            classHeading1="text-heading text-65 md:text-85 flex-row gap-3"
            classSpan="text-couple-separator text-28 w-7.5 h-7.5 md:w-10 md:h-10 leading-7.5 md:leading-11.25" />

        <!-- Mensaje cuando ya está confirmado -->
        <app-m01-confirmation-status *ngIf="isConfirmed" [invitationData]="invitationData"></app-m01-confirmation-status>

        <!-- Mensaje cuando está rechazada -->
        <app-m01-declined-status *ngIf="isDeclined"></app-m01-declined-status>

        <!-- Mensaje de error cuando falla la carga -->
        <app-m01-error-status *ngIf="error && !isConfirmed && !isDeclined" [error]="error"></app-m01-error-status>

        <!-- Cuando hay una sola opción, mostrar como botón -->
        <div *ngIf="isSingleOption && !isConfirmed && !isDeclined && !error"
            class="flex justify-center items-center w-full px-4">
            <button (click)="openModal()"
                class="bg-primary hover:bg-primary-soft font-bold rounded-50 text-white px-6 py-2.5 md:px-8.25 md:py-3.25 text-sm md:text-base lg:text-lg uppercase transition-all cursor-pointer shadow-md max-w-full text-center">
                {{ pageCopy.rsvp.confirmPresence }}
            </button>
        </div>

        <!-- Cuando hay múltiples opciones, mostrar como lista -->
        <ul *ngIf="!isSingleOption && !isConfirmed && !isDeclined && !error"
            class="text-theme-text uppercase font-normal flex flex-col gap-5 text-center md:text-right">
            <li (click)="openModal()" class="hover:text-primary-soft cursor-pointer">
                {{ pageCopy.rsvp.ceremony }}</li>
            <li *ngIf="FEATURE_FLAGS.SUGGEST_SONG" class="hover:text-primary-soft cursor-pointer">{{ pageCopy.rsvp.suggestSong }}</li>
            <li *ngIf="FEATURE_FLAGS.SCHEDULE_PARTY" class="hover:text-primary-soft cursor-pointer">{{ pageCopy.rsvp.scheduleParty }}</li>
            <li *ngIf="FEATURE_FLAGS.SCHEDULE_CEREMONY" class="hover:text-primary-soft cursor-pointer">{{ pageCopy.rsvp.scheduleCeremony }}
            </li>
        </ul>
    </div>

    <!-- Modal con paso a paso interno -->
    <app-modal [show]="isModalVisible" (close)="onModalClose()">
        <app-content-confirmation-modal (closeModal)="onModalClose()" />
    </app-modal>
</section>
