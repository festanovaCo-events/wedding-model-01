<div class="flex flex-col justify-center items-center gap-9">
  <div class="flex flex-col gap-5">
    <div class="p-6.25 w-43.75 h-43.75 bg-white rounded-half shadow-rounded">
      <div class="w-28 h-28 mx-auto">
        <ng-lottie [options]="options" (animationCreated)="animationCreated($event)" />
      </div>
    </div>

    <h3
      class="text-white text-40 bg-primary text-center belt-img relative inline-block leading-belt font-cookie">
      {{ titulo }}
    </h3>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h4 class="text-heading font-bold text-25">{{ labels.day }}</h4>
    <p class="text-theme-text font-normal text-base md:text-xl">{{ date }}</p>

    <a [href]="calendarRef" target="_blank" rel="noopener noreferrer"
      class="mt-4 bg-white text-theme-text text-center font-bold rounded-50 text-15 py-3.25 px-7.5
      shadow-soft transition-all hover:bg-primary hover:text-white leading-3.75 inline-block cursor-pointer">
      {{ labels.schedule }}
    </a>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h4 class="text-heading font-bold text-25">{{ labels.place }}</h4>
    <p class="text-theme-text font-normal text-base md:text-xl">{{ place }}</p>
  </div>

  <div class="flex flex-col justify-center items-center gap-2">
    <h4 class="text-heading font-bold text-25">{{ labels.address }}</h4>
    <p class="text-theme-text font-normal text-base md:text-xl">{{ address }}</p>

    <a [href]="mapsHref" target="_blank"
      rel="noopener noreferrer"
      class="mt-4 bg-white text-theme-text text-center font-bold rounded-50 text-15 py-3.25 px-7.5
      shadow-soft transition-all hover:bg-primary hover:text-white leading-3.75 inline-block cursor-pointer">
      {{ labels.directions }}
    </a>
  </div>
</div>
